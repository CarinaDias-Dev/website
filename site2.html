<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Usando TAGS</title>
    </head>
    <body>
        <h1>Usando tags textuais</h1>
        <p>Este texto é <strong>importante</strong>.</p>
        <p>Este texto é <em>enfatizado</em>.</p>
        <p>Este texto é <s>taxado</s>.</p>
        <h2>TAGS Semânticas</h2>
        <nav>
            <a href="#">Usada</a>
            <a href="#">Para</a>
            <a href="#">Transmitir</a>
            <a href="#">Significado</a>
        </nav>
        <h3>TAGS de Formatação</h3>
        <p>Este texto está no formato <i>italic</i>.</p>
        <p><del>Este texto foi excluido</del></p>
        <p><ins>Este texto foi inserido</ins>.</p>
    </body>
</html>
