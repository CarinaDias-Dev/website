<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Listas e tabelas</title>
    </head>
    <body>
        <h1>Listas na HTML</h1>
        <p>Ordenada</p>
        <ol>
            <li>Primeiro item</li>
            <li>Segundo item</li>
        </ol>
        <p>Não ordenadas</p>
        <ul>
            <li>Arroz</li>
            <li>Feijão</li>
        </ul>
        <h2>Tabelas na HTML</h2>
        <table>
            <tr>
                <th>Itens</th>
                <th>Quantidade</th>
                <th>Total</th>
            </tr>
            <tr>
                <td>Registro 01</td>
                <td>3</td>
                <td>R$30</td>
            </tr>
            <tr>
                <td>Registro 02</td>
                <td>2</td>
                <td>$30</td>
            </tr>
        </table>
    </body>
</html>
